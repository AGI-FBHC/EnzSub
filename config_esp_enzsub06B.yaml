backbone: ESM2-650M
embedding_root: embeddings/esp/06B
states:
  Base: esm2_t33_650M_base
  CPT: esm2_t33_650M_cpt
  Base-SUB: esm2_t33_650M_base_sub
  CPT-SUB: esm2_t33_650M_cpt_sub

files:
  train: processed_train_final_with_smiles.pkl
  test: processed_test_final_with_smiles.pkl

seeds: [2026, 2025, 3047]
