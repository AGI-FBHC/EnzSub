schema_version: 1
release_status: partial_artifacts_available

archives:
  embeddings:
    provider: Hugging Face
    repository: chaohua06/EnzSub-Embeddings
    repository_type: dataset
    url: https://huggingface.co/datasets/chaohua06/EnzSub-Embeddings
    local_path: embeddings
    status: available
    doi: null
    checksum_manifest: null
  checkpoints:
    provider: Hugging Face
    repository: chaohua06/EnzSub
    repository_type: model
    url: https://huggingface.co/chaohua06/EnzSub
    local_path: checkpoints/released
    status: available
    doi: null
    checksum_manifest: null

repository_data:
  - name: ec_labels
    path: data/ec
    used_by: [ec, hcft]
  - name: ph_labels_and_sequences
    path: data/ph
    used_by: [ph]
  - name: tm_labels_and_sequences
    path: data/tm
    used_by: [tm]
  - name: active_site_labels_and_sequences
    path: data/active_site
    used_by: [active_site]
  - name: rns_input_sequences
    path: data/rns
    used_by: [rns]

external_artifacts:
  - name: released_embeddings
    path: embeddings
    used_by:
      - ec
      - esp
      - active_site
      - ph
      - tm
      - hcft
      - substrate_coherence
      - rns
      - ReactZyme
      - Seq2Topt
      - UniKP
    status: available
    archive: embeddings
  - name: final_cpt_sub_checkpoints
    path: checkpoints/released
    used_by: [downstream, transfer, rns]
    status: available
    archive: checkpoints
  - name: cpt_training_data
    path: data/cpt
    used_by: [cpt]
    status: pending_release
  - name: sub_training_data
    path: data/sub
    used_by: [sub]
    status: pending_release
  - name: intermediate_cpt_checkpoints
    path: checkpoints/cpt
    used_by: [cpt_sub_training]
    status: pending_release

generated_outputs:
  path: artifacts
  tracked_by_git: false
  status: generated_locally
