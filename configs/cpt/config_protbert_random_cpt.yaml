
paths:
  model_name: "Rostlab/prot_bert_bfd"
  train_fasta_file: "data/cpt/ENZ30_train.fasta"
  val_fasta_file: "data/cpt/ENZ30_val.fasta"
  output_dir: "artifacts/cpt/protbert_random_cpt"

  train_descriptor_file: "data/cpt/ENZ30_train_desc.pt"
  val_descriptor_file:   "data/cpt/ENZ30_val_desc.pt"

wandb:
  enabled: false
  project: "enzyme-cpt-protbert"
  run_name: "protbert_bfd_random_cpt"
  tags:
    - "protbert_bfd"
    - "random_masking"
    - "cpt"
    - "ddp"
    - "enz30"
  notes: "ProtBERT-BFD random-mask CPT on ENZ30."
  save_model: false

training:
  auto_resume: false
  resume_from: null
  seed: 2026

  random_masking:
    mask_prob: 0.15
    mask_token_prob: 0.8
    random_token_prob: 0.1
    keep_token_prob: 0.1

  batch_size: 32
  gradient_accumulation_steps: 1
  num_epochs: 3
  max_sequence_length: 1022
  eval_batch_size: 32
  save_every_n_steps: 2500

  optimizer:
    lr: 5e-5
    betas: [0.9, 0.98]
    eps: 1e-6
    weight_decay: 0.01

  precision: bf16
  prefetch_factor: 1

  scheduler: "cosine"
  warmup_ratio: 0.05

  unfreeze_last_n_layers: 6
  unfreeze_lm_head: true

  gradient_clip_norm: 1.0

  eval_steps: 250000
  quick_eval_batches: 200

  num_workers: 1
  save_every_n_epochs: 1
  log_interval: 100

  balanced_cpt:
    enabled: false

    descriptor:
      enabled: false
      weight: 0.05
      dim: 41
      dropout: 0.1
