
paths:
  model_checkpoint: "esm2_t36_3B_UR50D"

  train_fasta_file: "data/cpt/ENZ30_train.fasta"
  val_fasta_file:   "data/cpt/ENZ30_val.fasta"

  train_descriptor_file: "data/cpt/ENZ30_train_desc.pt"
  val_descriptor_file:   "data/cpt/ENZ30_val_desc.pt"
  descriptor_stats_file: "data/cpt/ENZ30_desc_stats.json"

  output_dir: "artifacts/cpt/esm2_3B_random_cpt"

wandb:
  enabled: false
  project: "enzyme-cpt-esm2"
  run_name: "esm2_3B_random_cpt"
  tags:
    - "esm2"
    - "esm2_3B"
    - "random_masking"
    - "cpt"
    - "ddp"
    - "enz30"
  notes: "ESM-2 3B random-mask CPT on ENZ30"

training:
  auto_resume: false
  resume_from: null
  seed: 2026

  random_masking:
    mask_prob: 0.15
    mask_token_prob: 0.8
    random_token_prob: 0.1
    keep_token_prob: 0.1

  batch_size: 4
  gradient_accumulation_steps: 2
  num_epochs: 3
  max_sequence_length: 1022
  eval_batch_size: 1
  save_every_n_steps: 2500

  optimizer:
    lr: 5e-5
    betas: [0.9, 0.98]
    eps: 1e-8
    weight_decay: 0.01

  scheduler: "cosine"
  warmup_ratio: 0.05

  precision: bf16
  gradient_clip_norm: 0.5

  unfreeze_last_n_layers: 6
  unfreeze_lm_head: true

  save_every_n_epochs: 1

  eval_steps: 250000
  quick_eval_batches: 1

  log_interval: 100

  num_workers: 1
  prefetch_factor: 2

  balanced_cpt:
    enabled: false

    descriptor:
      enabled: false
      weight: 0.05
      dim: 41
      dropout: 0.1

    anchor:
      enabled: false
