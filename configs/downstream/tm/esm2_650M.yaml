device: "cuda:0"
batch_size: 16
encoder_type: esm2_t33_650M
sub_parent_dir: src

data:
  train_fasta: data/tm/train.fasta
  val_fasta: data/tm/val.fasta
  test_fasta: data/tm/test.fasta
  train_csv: data/tm/train.csv
  val_csv: data/tm/val.csv
  test_csv: data/tm/test.csv

emb_root: artifacts/downstream/tm/embeddings/esm2_650M

models:
  base:
    mode: base
    lora_rank: 16
    lora_alpha: 32
  cpt:
    mode: cpt
    checkpoint: checkpoints/cpt/esm2_650M_step_40000.pt
    lora_rank: 16
    lora_alpha: 32
  base_sub:
    mode: base_sub
    checkpoint: checkpoints/sub/esm2_650M_base_sub.pt
    lora_rank: 16
    lora_alpha: 32
  cpt_sub:
    mode: cpt_sub
    checkpoint: checkpoints/sub/esm2_650M_cpt_sub.pt
    lora_rank: 16
    lora_alpha: 32

eval:
  seeds: [2025, 2026, 3047]
  methods: [xgboost, knn]
  xgboost:
    cv_folds: 0
  knn:
    ks: [1, 3, 5, 10, 20, 50]
    metric: cosine

results_root: artifacts/downstream/tm/results/esm2_650M
