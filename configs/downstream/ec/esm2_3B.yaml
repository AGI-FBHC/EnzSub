device: "cuda:0"
batch_size: 8
max_len: 1022
encoder_type: esm2_t36_3B
sub_parent_dir: src
fasta_files:
  - data/ec/split100.fasta
  - data/ec/price.fasta
  - data/ec/new.fasta
emb_root: artifacts/downstream/ec/embeddings/esm2_3B
models:
  base:
    mode: base
    lora_rank: 16
    lora_alpha: 32
  cpt:
    mode: cpt
    checkpoint: checkpoints/cpt/esm2_3B_step_40000.pt
    lora_rank: 16
    lora_alpha: 32
  base_sub:
    mode: base_sub
    checkpoint: checkpoints/sub/esm2_3B_base_sub.pt
    lora_rank: 16
    lora_alpha: 32
  cpt_sub:
    mode: cpt_sub
    checkpoint: checkpoints/sub/esm2_3B_cpt_sub.pt
    lora_rank: 16
    lora_alpha: 32
knn:
  k_values: [1, 3]
  tau: 0.5
  train_csv: data/ec/split100.csv
  test_sets:
    price: data/ec/price.csv
    new: data/ec/new.csv
    split10:
      query: data/ec/split10.csv
      gallery: data/ec/split100.csv
      exclude_self: true
  output_dir: artifacts/downstream/ec/results/esm2_3B
