device: "cuda:0"
batch_size: 16
max_len: 1022
encoder_type: protbert_bfd
sub_parent_dir: src
fasta_files:
  - data/ec/split100.fasta
  - data/ec/price.fasta
  - data/ec/new.fasta
emb_root: artifacts/downstream/ec/embeddings/protbert
models:
  base:
    mode: base
    lora_rank: 4
    lora_alpha: 8
  cpt:
    mode: cpt
    checkpoint: checkpoints/cpt/protbert_step_40000.pt
    lora_rank: 4
    lora_alpha: 8
  base_sub:
    mode: base_sub
    checkpoint: checkpoints/sub/protbert_base_sub.pt
    lora_rank: 4
    lora_alpha: 8
  cpt_sub:
    mode: cpt_sub
    checkpoint: checkpoints/sub/protbert_cpt_sub.pt
    lora_rank: 4
    lora_alpha: 8
knn:
  k_values: [1, 3]
  tau: 0.5
  train_csv: data/ec/split100.csv
  test_sets:
    price: data/ec/price.csv
    new: data/ec/new.csv
    split10:
      query: data/ec/split10.csv
      gallery: data/ec/split100.csv
      exclude_self: true
  output_dir: artifacts/downstream/ec/results/protbert
