common:
  ec_level: 4
  match_mode: any_overlap

hcft_eval:
  embedding_dirs:
    protbert_base: artifacts/downstream/ec/embeddings/protbert/paper/protbert_bfd_base
    protbert_cpt: artifacts/downstream/ec/embeddings/protbert/paper/protbert_bfd_cpt
    protbert_base_sub: artifacts/downstream/ec/embeddings/protbert/paper/protbert_bfd_base_sub
    protbert_cpt_sub: artifacts/downstream/ec/embeddings/protbert/paper/protbert_bfd_cpt_sub

  label_csv: data/ec/split100.csv
  identity_pairs: artifacts/downstream/ec/hcft/identity_pairs/split100/pair_identity.csv
  output_dir: artifacts/downstream/ec/hcft/experiments/protbert_general

  negative_mode: general

  positive_max_identity: 40.0
  negative_min_identity: 40.0
  min_identity_margin: 10.0

  n_neg_per_pos: 5
  max_pos_per_anchor: 200
  max_neg_per_anchor: 500
  max_triplets_per_anchor: 1000
  min_triplets_per_anchor: 10
  n_seeds: 1
  baseline_name: protbert_base
  chunk_size: 100000
  save_triplets: false